<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Rota Santos</title>
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <!-- fonte do cartão do estúdio (Bebas Neue, SIL OFL, local): pré-carregada para o texto não piscar com fonte errada -->
    <link rel="preload" href="./fonts/bebas-neue/bebas-neue-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>try{var t=localStorage.getItem('rota.theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
    <style>
      @font-face{font-family:"Bebas Neue";font-style:normal;font-weight:400;font-display:block;src:url("./fonts/bebas-neue/bebas-neue-latin-400-normal.woff2") format("woff2")}
      html,body{background:#000}
      /* cena 0: só preto até a abertura montar (a splash nativa do Android também é só preto) */
      #boot-shell{position:fixed;inset:0;background:#000;z-index:99998;display:grid;place-items:center;color:#94a3b8;font:14px system-ui,sans-serif;text-align:center;padding:24px}
      #boot-shell button{margin-top:12px;background:#7c3aed;color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:600;font-size:15px}
    </style>
  </head>
  <body>
    <div id="boot-shell" aria-hidden="true"><div id="boot-msg"></div></div>
    <div id="abertura-root"></div>
    <div id="root"></div>
    <script>
      // Rede de segurança INLINE (funciona mesmo se o pacote JS falhar): sem montar em 15 s, mostra mensagem e "Tentar de novo".
      window.__bootT = setTimeout(function () {
        var s = document.getElementById('boot-shell'); if (!s) return;
        s.removeAttribute('aria-hidden');
        var m = document.getElementById('boot-msg');
        m.textContent = 'Está demorando mais que o normal para abrir.';
        var b = document.createElement('button'); b.textContent = 'Tentar de novo'; b.onclick = function () { location.reload(); };
        m.appendChild(document.createElement('br')); m.appendChild(b);
      }, 15000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
